/* ================================================================
   V2 — FRAGMENT ABSORPTION (the first "wow" moment, section 22)
================================================================ */
let absorption = null; // { startTime, fragment }

function startFragmentAbsorption(fragment) {
  if (fragment.userData.collected) return;
  fragment.userData.collected = true;
  absorption = { startTime: clock.getElapsedTime(), fragment };
}

function updateFragmentAbsorption(t) {
  if (!absorption) return;
  const age = t - absorption.startTime;
  const fragment = absorption.fragment;
  const planetWorldPos = new THREE.Vector3();
  planetGroup.getWorldPosition(planetWorldPos);

  if (age < 1.0) {
    // brighten and pull inward slightly, particles gather
    const p = age / 1.0;
    fragment.children[0].material.emissiveIntensity = 0.7 + p * 2;
    fragment.scale.setScalar(1 + p * 0.4);
  } else if (age < 1.8) {
    // travel to the planet as a small energy sphere
    const p = (age - 1.0) / 0.8;
    fragment.position.lerpVectors(fragment.userData.basePosition, planetWorldPos, p * p);
    fragment.scale.setScalar(Math.max(0.1, 1.4 * (1 - p * 0.6)));
  } else if (age < 1.85) {
    // impact — trigger the big wow exactly once
    if (!absorption.wowFired) {
      absorption.wowFired = true;
      triggerBigWow();
    }
    fragment.visible = false;
  } else {
    gameState.collectedFragments += 1;
    updateWorldState();
    absorption = null;
  }
}

function triggerBigWow() {
  const t0 = clock.getElapsedTime();
  wowEvent = { start: t0 };
  gameState.energy += 3;

  // scatter a burst of ripples across the planet surface
  for (let i = 0; i < 5; i++) {
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    const r = CONFIG.planet.radius;
    const pos = new THREE.Vector3(
      r * Math.sin(phi) * Math.cos(theta),
      r * Math.sin(phi) * Math.sin(theta),
      r * Math.cos(phi)
    );
    spawnSurfaceRipple(pos);
  }
}

let wowEvent = null;
function updateWowEvent(t) {
  if (!wowEvent) return;
  const age = t - wowEvent.start;
  const duration = 1.4;
  if (age > duration) {
    wowEvent = null;
    return;
  }
  const p = age / duration;
  // brief darken-then-flash on the planet material, plus a ring speed burst
  const flash = Math.sin(p * Math.PI); // rises then falls
  planetMesh.material.emissiveIntensity = 0.6 + flash * 3;
  glowMesh.material.opacity = CONFIG.planet.glowOpacity + flash * 0.5;
  ringMeshes.forEach((r) => (r.rotation.z += r.userData.speed * flash * 10));
  const pushback = 1 - flash * 0.4;
  nearParticles.scale.setScalar(1 + flash * 0.15);
}

/* ================================================================
   V2 — PORTAL TRANSITION (section 9)
   V3 note: activating the portal now leads into the real
   Constellation zone (see V3 ZONE SYSTEM below) instead of the
   old "peek and return" dolly. The camera-dolly phases are reused
   as the first half of that longer sequence.
================================================================ */
function triggerPortalTransition() {
  triggerZoneTransition('constellation', portalGroup, portalDisc.material);
}

/* ================================================================
   V3/V4 — ZONE SYSTEM
   One scene, one camera, one renderer — zones are just THREE.Group
   visibility toggles, per section 29. Add a future zone by:
     1. building its content in its own group (see createConstellationZone)
     2. adding a camera-start entry to getZoneCameraStart()
     3. calling triggerZoneTransition('yourZoneName', someGroup, someMaterial)
================================================================ */
let activeZone = 'hub';
let constellationGroup;
let gravityGroup;
let zoneTransition = null; // { toZone, targetGroup, flashMaterial, startTime }

const FLASH_OVERLAY = () => document.getElementById('flash-overlay');

function getZoneCameraStart(zone) {
  if (zone === 'constellation') return CONFIG.constellation.cameraStart;
  if (zone === 'gravity') return CONFIG.gravity.cameraStart;
  return CONFIG.camera.startDistance;
}

function enterZone(name) {
  activeZone = name;
  gameState.currentZone = name;
  hubGroup.visible = name === 'hub';
  constellationGroup.visible = name === 'constellation';
  gravityGroup.visible = name === 'gravity';

  if (name === 'hub') {
    cameraRig.distance = CONFIG.camera.startDistance;
    cameraRig.targetDistance = CONFIG.camera.startDistance;
    document.getElementById('drag-hint').textContent = 'DRAG TO EXPLORE';
    document.getElementById('drag-hint').classList.toggle('hidden', hasInteracted);
    document.getElementById('progress-index').textContent =
      `${String(gameState.discoveries).padStart(2, '0')} / DISCOVERY`;
    if (gameState.collectedCores >= 1) spawnHubCoreObject();
    if (gameState.collectedGravitySeeds >= 1) spawnHubGravitySeedObject();
  } else if (name === 'constellation') {
    cameraRig.distance = CONFIG.constellation.cameraStart;
    cameraRig.targetDistance = CONFIG.constellation.cameraStart;
    document.getElementById('drag-hint').textContent = 'DRAG TO CONNECT';
    document.getElementById('drag-hint').classList.toggle('hidden', hasInteractedConstellation);
    updateConstellationProgressUI();
  } else if (name === 'gravity') {
    cameraRig.distance = CONFIG.gravity.cameraStart;
    cameraRig.targetDistance = CONFIG.gravity.cameraStart;
    document.getElementById('progress-index').textContent = 'GRAVITY';
    document.getElementById('drag-hint').classList.add('hidden');
    showGravityFirstHint();
  }
  saveGame();
}

/* ----------------------------------------------------------
   Phased cinematic transition, reused for every zone pair
   (sections 2, 4 & 23 — same choreography, different targets)
---------------------------------------------------------- */
function triggerZoneTransition(toZone, targetGroup, flashMaterial) {
  if (zoneTransition) return;
  const warm = toZone === 'gravity' || activeZone === 'gravity';
  FLASH_OVERLAY().classList.toggle('warm', warm);
  zoneTransition = { toZone, targetGroup, flashMaterial, startTime: clock.getElapsedTime() };
}

function updateZoneTransition(t) {
  if (!zoneTransition) return;
  const age = t - zoneTransition.startTime;

  // phase durations — shared by every zone pair
  const brighten = 0.8;
  const gather = 0.8;
  const advance = 1.2;
  const flashIn = 0.4;
  const flashOut = 1.0;
  const swapAt = brighten + gather + advance + flashIn;
  const total = swapAt + flashOut;

  const overlay = FLASH_OVERLAY();

  if (age < brighten) {
    // phase 1 — the destination flares brighter
    const p = age / brighten;
    if (zoneTransition.flashMaterial) {
      zoneTransition.flashMaterial.opacity = THREE.MathUtils.lerp(
        zoneTransition.flashMaterial.opacity, 0.9, p
      );
    }
  } else if (age < brighten + gather) {
    // phase 2/3 — particles pulled inward, the current zone slows
    const p = (age - brighten) / gather;
    if (nearParticles) nearParticles.material.opacity = THREE.MathUtils.lerp(nearParticles.material.opacity, 0.15, p);
  } else if (age < brighten + gather + advance) {
    // phase 4 — camera advances toward the destination
    const p = (age - brighten - gather) / advance;
    const eased = p * p * (3 - 2 * p);
    const targetPos = new THREE.Vector3();
    zoneTransition.targetGroup.getWorldPosition(targetPos);
    if (!zoneTransition.camFrom) zoneTransition.camFrom = camera.position.clone();
    camera.position.lerpVectors(zoneTransition.camFrom, targetPos, eased);
    camera.lookAt(targetPos);
  } else if (age < swapAt) {
    // phase 5 — screen goes bright
    const p = (age - brighten - gather - advance) / flashIn;
    if (overlay) overlay.style.opacity = p.toFixed(3);
  } else if (age < total) {
    // phase 6 — swap zones at peak brightness, then fade back in
    if (!zoneTransition.swapped) {
      zoneTransition.swapped = true;
      const startDist = getZoneCameraStart(zoneTransition.toZone);
      enterZone(zoneTransition.toZone);
      camera.position.set(0, 0, startDist);
      camera.lookAt(0, 0, 0);
      if (zoneTransition.toZone === 'hub') nearParticles.material.opacity = 0.7;
    }
    const p = (age - swapAt) / flashOut;
    if (overlay) overlay.style.opacity = (1 - p).toFixed(3);
  } else {
    if (overlay) overlay.style.opacity = 0;
    zoneTransition = null;
  }
}

/* ----------------------------------------------------------
   CONSTELLATION ZONE — content
---------------------------------------------------------- */
let constellationPoints = [];
let constellationLines;      // permanent, correctly-connected lines
let tempConnectLine;         // the line following the cursor while connecting
let connecting = null;       // { fromPoint }
let connectedPairs = new Set();
let coreMesh, coreGlow;
let coreRewardGroup = null;
let returnPortalGroup = null, returnPortalDisc = null;
let hasInteractedConstellation = false;
let hoveredConstellationPoint = null;
let hoveredCoreReward = false;
let hoveredReturnPortal = false;

function createConstellationZone() {
  constellationGroup = new THREE.Group();
  constellationGroup.visible = false;
  scene.add(constellationGroup);

  // a colder, deeper starfield unique to this zone
  const count = 2200;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 60 * (0.3 + Math.random() * 0.7);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xcfe8ff,
    size: 0.05,
    transparent: true,
    opacity: 0.6,
    sizeAttenuation: true,
  });
  constellationGroup.add(new THREE.Points(geo, mat));

  // the central core / "noyau"
  const coreGeo = new THREE.IcosahedronGeometry(CONFIG.constellation.coreRadius, 1);
  const coreMat = new THREE.MeshStandardMaterial({
    color: 0x14203a,
    emissive: CONFIG.constellation.coreColor,
    emissiveIntensity: 0.8,
    flatShading: true,
  });
  coreMesh = new THREE.Mesh(coreGeo, coreMat);
  constellationGroup.add(coreMesh);

  const coreGlowGeo = new THREE.IcosahedronGeometry(CONFIG.constellation.coreRadius * 1.8, 1);
  const coreGlowMat = new THREE.MeshBasicMaterial({
    color: CONFIG.constellation.coreColor,
    transparent: true,
    opacity: 0.3,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  coreGlow = new THREE.Mesh(coreGlowGeo, coreGlowMat);
  constellationGroup.add(coreGlow);

  createConstellationPoints();
  createConstellationLines();
  createReturnPortalObject();
}

function createConstellationPoints() {
  const n = CONFIG.constellation.pointCount;
  const golden = Math.PI * (3 - Math.sqrt(5));

  // give paired points a shared pulse phase — a subtle hint (section 18)
  const pairPhase = {};
  CONFIG.constellation.solution.forEach(([a, b], i) => {
    const phase = i * 1.3;
    pairPhase[a] = phase;
    pairPhase[b] = phase;
  });

  for (let i = 0; i < n; i++) {
    const y = 1 - (i / (n - 1)) * 2;
    const radiusAtY = Math.sqrt(1 - y * y);
    const theta = golden * i * 1.7; // extra twist so the layout isn't an obvious path
    const r = CONFIG.constellation.fieldRadius * (0.75 + Math.random() * 0.4);
    const pos = new THREE.Vector3(
      Math.cos(theta) * radiusAtY,
      y,
      Math.sin(theta) * radiusAtY
    ).multiplyScalar(r);

    const isDecoy = !(i in pairPhase);
    const geo = new THREE.SphereGeometry(0.1, 12, 12);
    const mat = new THREE.MeshBasicMaterial({
      color: CONFIG.constellation.color,
      transparent: true,
      opacity: isDecoy ? 0.12 : 0.22,
    });
    const point = new THREE.Mesh(geo, mat);
    point.position.copy(pos);

    const haloMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(),
      color: CONFIG.constellation.color,
      transparent: true,
      opacity: isDecoy ? 0.15 : 0.3,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const halo = new THREE.Sprite(haloMat);
    halo.scale.set(0.6, 0.6, 0.6);
    point.add(halo);

    point.userData = {
      id: i,
      halo,
      connected: false,
      pulsePhase: pairPhase[i] !== undefined ? pairPhase[i] : Math.random() * Math.PI * 2,
    };

    constellationGroup.add(point);
    constellationPoints.push(point);
  }
}

function createConstellationLines() {
  constellationLines = new THREE.Group();
  constellationGroup.add(constellationLines);

  // reusable temp line for the in-progress drag connection —
  // a bright thin core plus a soft wide line behind it (section 13)
  const tempGeo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(), new THREE.Vector3(),
  ]);
  const tempMat = new THREE.LineBasicMaterial({
    color: CONFIG.constellation.coreColor,
    transparent: true,
    opacity: 0.7,
  });
  tempConnectLine = new THREE.Line(tempGeo, tempMat);
  tempConnectLine.visible = false;
  constellationGroup.add(tempConnectLine);
}

function makeConnectionLine(pointA, pointB) {
  const group = new THREE.Group();
  const pts = [pointA.position.clone(), pointB.position.clone()];

  const coreGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const coreMat = new THREE.LineBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 0.9,
  });
  group.add(new THREE.Line(coreGeo, coreMat));

  const glowGeo = new THREE.BufferGeometry().setFromPoints(pts);
  const glowMat = new THREE.LineBasicMaterial({
    color: CONFIG.constellation.coreColor,
    transparent: true,
    opacity: 0.25,
    linewidth: 2,
  });
  group.add(new THREE.Line(glowGeo, glowMat));

  group.userData = { birth: clock.getElapsedTime() };
  return group;
}

/* ----------------------------------------------------------
   Connecting interaction — confirm / reject
---------------------------------------------------------- */
function confirmConnection(fromPoint, toPoint) {
  const key = [fromPoint.userData.id, toPoint.userData.id].sort().join('-');
  connectedPairs.add(key);
  fromPoint.userData.connected = true;
  toPoint.userData.connected = true;

  const line = makeConnectionLine(fromPoint, toPoint);
  constellationLines.add(line);
  spawnLinePulse(fromPoint.position.clone(), toPoint.position.clone());
  spawnCursorRipple();

  gameState.constellationProgress.push(key);
  updateConstellationProgressUI();
  saveGame();

  if (connectedPairs.size >= CONFIG.constellation.solution.length) {
    triggerConstellationCompletion();
  }
}

function rejectConnection() {
  const mat = tempConnectLine.material;
  const startOpacity = mat.opacity;
  const startTime = clock.getElapsedTime();
  function fade() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.4, 1);
    mat.opacity = startOpacity * (1 - p);
    tempConnectLine.position.x = (Math.random() - 0.5) * 0.03 * (1 - p); // tiny tremble
    if (p < 1) {
      requestAnimationFrame(fade);
    } else {
      tempConnectLine.visible = false;
      tempConnectLine.position.set(0, 0, 0);
      mat.opacity = 0.7;
    }
  }
  fade();
}

/* small bright pulse that travels along a freshly confirmed line */
function spawnLinePulse(fromPos, toPos) {
  const geo = new THREE.SphereGeometry(0.06, 8, 8);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const pulse = new THREE.Mesh(geo, mat);
  pulse.position.copy(fromPos);
  constellationGroup.add(pulse);

  const startTime = clock.getElapsedTime();
  function travel() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.7, 1);
    pulse.position.lerpVectors(fromPos, toPos, p);
    mat.opacity = 1 - p * 0.3;
    if (p < 1) {
      requestAnimationFrame(travel);
    } else {
      constellationGroup.remove(pulse);
      geo.dispose();
      mat.dispose();
    }
  }
  travel();
}

function updateConstellationProgressUI() {
  const el = document.getElementById('progress-index');
  el.textContent = `CONSTELLATION ${String(connectedPairs.size).padStart(2, '0')} / ${CONFIG.constellation.solution.length}`;
}

/* ----------------------------------------------------------
   Completion sequence (section 20) + The Core (section 21)
---------------------------------------------------------- */
let constellationCompletion = null;

function triggerConstellationCompletion() {
  constellationCompletion = { startTime: clock.getElapsedTime(), wowFired: false };
}

function updateConstellationCompletionAnim(t) {
  if (!constellationCompletion) return;
  const age = t - constellationCompletion.startTime;

  if (age < 1.0) {
    // step 1 — every line goes fully bright
    constellationLines.children.forEach((line) => {
      line.children[0].material.opacity = 0.9 + Math.sin(age * 6) * 0.1;
    });
  } else if (age < 2.2) {
    // step 2/3 — the whole constellation spins up and points synchronize
    const p = (age - 1.0) / 1.2;
    constellationGroup.rotation.y += 0.01 + p * 0.03;
    constellationPoints.forEach((pt) => (pt.userData.pulsePhase = age * 3));
  } else if (age < 2.8) {
    // step 4 — one last wave along every line at once
    if (!constellationCompletion.waveFired) {
      constellationCompletion.waveFired = true;
      CONFIG.constellation.solution.forEach(([a, b]) => {
        spawnLinePulse(
          constellationPoints[a].position.clone(),
          constellationPoints[b].position.clone()
        );
      });
    }
  } else if (age < 3.6) {
    // step 5 — the core opens
    const p = (age - 2.8) / 0.8;
    coreMesh.scale.setScalar(1 - p * 0.6);
    coreGlow.material.opacity = 0.3 + p * 0.5;
  } else {
    // step 6 — a new form appears
    if (!constellationCompletion.rewardSpawned) {
      constellationCompletion.rewardSpawned = true;
      spawnCoreReward();
    }
    constellationCompletion = null;
  }
}

function spawnCoreReward() {
  coreMesh.visible = false;
  coreGlow.visible = false;

  coreRewardGroup = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(0.4, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0x9fd8ff,
    emissiveIntensity: 1.2,
    flatShading: true,
  });
  coreRewardGroup.add(new THREE.Mesh(geo, mat));

  const glowGeo = new THREE.IcosahedronGeometry(0.7, 1);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0x5ee7ff,
    transparent: true,
    opacity: 0.35,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  coreRewardGroup.add(new THREE.Mesh(glowGeo, glowMat));

  // two tiny satellite spheres orbiting the reward, plus a thin ring
  for (let i = 0; i < 2; i++) {
    const satGeo = new THREE.SphereGeometry(0.06, 8, 8);
    const satMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const sat = new THREE.Mesh(satGeo, satMat);
    sat.userData.orbitOffset = i * Math.PI;
    coreRewardGroup.add(sat);
  }
  const ringGeo = new THREE.RingGeometry(0.55, 0.58, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0x5ee7ff,
    transparent: true,
    opacity: 0.4,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const ring = new THREE.Mesh(ringGeo, ringMat);
  ring.rotation.x = 1.2;
  coreRewardGroup.add(ring);

  coreRewardGroup.scale.setScalar(0);
  constellationGroup.add(coreRewardGroup);
  showCenterMessage('CORE FORMED');

  const startTime = clock.getElapsedTime();
  function grow() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 1.4, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    coreRewardGroup.scale.setScalar(eased);
    if (p < 1) requestAnimationFrame(grow);
  }
  grow();
}

function collectCoreReward() {
  if (!coreRewardGroup || coreRewardGroup.userData.collected) return;
  coreRewardGroup.userData.collected = true;
  spawnCursorRipple();

  const startPos = coreRewardGroup.position.clone();
  const startTime = clock.getElapsedTime();
  function collectAnim() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.7, 1);
    const eased = p * p;
    coreRewardGroup.position.lerpVectors(startPos, camera.position, eased * 0.5);
    coreRewardGroup.scale.setScalar(Math.max(0, 1 - eased));
    if (p < 1) {
      requestAnimationFrame(collectAnim);
    } else {
      coreRewardGroup.visible = false;
      gameState.collectedCores += 1;
      updateFragmentUI();
      saveGame();
      revealReturnPortal();
    }
  }
  collectAnim();
}

/* ----------------------------------------------------------
   Return portal (section 23)
---------------------------------------------------------- */
function createReturnPortalObject() {
  returnPortalGroup = new THREE.Group();
  returnPortalGroup.position.set(0, -2, 5.5);
  returnPortalGroup.visible = false;

  const ringGeo = new THREE.TorusGeometry(1.1, 0.06, 10, 48);
  const ringMat = new THREE.MeshBasicMaterial({
    color: 0xff8a3d,
    transparent: true,
    opacity: 0.5,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  returnPortalGroup.add(new THREE.Mesh(ringGeo, ringMat));

  const discGeo = new THREE.CircleGeometry(1.0, 32);
  const discMat = new THREE.MeshBasicMaterial({
    color: 0xff8a3d,
    transparent: true,
    opacity: 0.2,
    side: THREE.DoubleSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  returnPortalDisc = new THREE.Mesh(discGeo, discMat);
  returnPortalGroup.add(returnPortalDisc);

  constellationGroup.add(returnPortalGroup);
}

function revealReturnPortal() {
  returnPortalGroup.visible = true;
}

/* ----------------------------------------------------------
   Per-frame constellation update
---------------------------------------------------------- */
function updateConstellationZone(t) {
  if (activeZone !== 'constellation' && !zoneTransition) return;

  // idle auto-drift so the constellation feels like it's floating (section 17)
  if (interactionMode !== 'rotate') {
    constellationGroup.rotation.y += CONFIG.constellation.cameraIdleSpeed;
  }

  coreMesh.rotation.y += 0.003;
  const breathe = 1 + Math.sin(t * 0.6) * 0.05;
  if (coreGlow.visible) coreGlow.scale.setScalar(breathe);

  constellationPoints.forEach((pt) => {
    const isHovered = pt === hoveredConstellationPoint;
    const basePulse = pt.userData.connected ? 0.35 : (pt.userData.pulsePhase !== undefined ? 0.05 : 0);
    const pulse = Math.sin(t * 1.6 + pt.userData.pulsePhase) * basePulse;
    const targetOpacity = (pt.userData.connected ? 0.85 : 0.2) + pulse + (isHovered ? 0.4 : 0);
    pt.material.opacity = THREE.MathUtils.clamp(targetOpacity, 0.05, 1);
    const s = isHovered ? 1.7 : pt.userData.connected ? 1.3 : 1;
    pt.scale.setScalar(s);
    pt.userData.halo.material.opacity = pt.material.opacity * 0.6;
  });

  if (returnPortalGroup.visible) {
    returnPortalGroup.children[0].rotation.z += 0.006;
    const idle = 1 + Math.sin(t * 1.2) * 0.05;
    returnPortalDisc.material.opacity = 0.2 + Math.sin(t * 1.5) * 0.05;
    returnPortalGroup.scale.setScalar(idle);
  }

  if (coreRewardGroup && coreRewardGroup.visible && !coreRewardGroup.userData.collected) {
    coreRewardGroup.rotation.y += 0.01;
    coreRewardGroup.children.forEach((child, i) => {
      if (child.userData.orbitOffset !== undefined) {
        const a = t * 1.4 + child.userData.orbitOffset;
        child.position.set(Math.cos(a) * 0.75, Math.sin(a) * 0.3, Math.sin(a) * 0.75);
      }
    });
  }

  updateConstellationCompletionAnim(t);
}

/* ================================================================
   V4 — GRAVITY ZONE
   A physics-driven zone: nuclei with position/velocity/mass, pulled
   by a custom simplified gravity toward the Gravity Core, nudged by
   the player through attraction/repulsion cursor fields.
================================================================ */
let gravityCore, gravityCoreGlow;
let gravityNuclei = [];
let gravityOrbitRings = [];
let gravitySeedGroup = null;
let gravityReturnPortalGroup = null, gravityReturnPortalDisc = null;
let hoveredNucleus = null;
let hoveredGravitySeed = false;
let hoveredGravityReturnPortal = false;
let draggedNucleus = null;
let shiftHeld = false;
let hasSeenGravityHint = false;
let gravityCompletion = null;
const gravityState = { stability: 0, lockedCount: 0 };
const secretDrag = { active: false, shiftAtStart: false, pulledIds: new Set() };

function createGravityZone() {
  gravityGroup = new THREE.Group();
  gravityGroup.visible = false;
  scene.add(gravityGroup);

  // warm, dense background — the visual opposite of Constellation
  const count = 1800;
  const positions = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 55 * (0.3 + Math.random() * 0.7);
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
    positions[i * 3 + 2] = r * Math.cos(phi);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  const mat = new THREE.PointsMaterial({
    color: 0xffb37a,
    size: 0.05,
    transparent: true,
    opacity: 0.5,
    sizeAttenuation: true,
  });
  gravityGroup.add(new THREE.Points(geo, mat));

  // a couple of large, distant, softly-lit spheres for depth (section 5)
  [[-20, 8, -30, 3.5, 0x3a1a4a], [18, -10, -35, 4.5, 0x5a2410]].forEach(([x, y, z, r, color]) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(r, 16, 16),
      new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.5 })
    );
    m.position.set(x, y, z);
    gravityGroup.add(m);
  });

  // zone-local warm lights
  const warmLight = new THREE.PointLight(0xff8a3d, 2.2, 30);
  warmLight.position.set(4, 3, 4);
  gravityGroup.add(warmLight);
  const violetLight = new THREE.PointLight(0x6b2fb0, 1.6, 30);
  violetLight.position.set(-5, -2, -3);
  gravityGroup.add(violetLight);

  createGravityCore();
  createGravityOrbitRings();
  createGravityNuclei();
  createGravityReturnPortalObject();
}

function createGravityCore() {
  const cfg = CONFIG.gravity;
  // slightly deformed icosahedron — "densité, masse, énergie comprimée"
  const geo = new THREE.IcosahedronGeometry(cfg.coreRadius, 2);
  const posAttr = geo.attributes.position;
  for (let i = 0; i < posAttr.count; i++) {
    const v = new THREE.Vector3().fromBufferAttribute(posAttr, i);
    const bump = 1 + (Math.sin(v.x * 3) * Math.cos(v.y * 2) * Math.sin(v.z * 4)) * 0.06;
    v.multiplyScalar(bump);
    posAttr.setXYZ(i, v.x, v.y, v.z);
  }
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({
    color: 0x1a0e08,
    emissive: cfg.coreColor,
    emissiveIntensity: 0.9,
    metalness: 0.4,
    roughness: 0.5,
    flatShading: true,
  });
  gravityCore = new THREE.Mesh(geo, mat);
  gravityGroup.add(gravityCore);

  const glowGeo = new THREE.IcosahedronGeometry(cfg.coreRadius * 1.35, 1);
  const glowMat = new THREE.MeshBasicMaterial({
    color: cfg.coreColor,
    transparent: true,
    opacity: 0.3,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  gravityCoreGlow = new THREE.Mesh(glowGeo, glowMat);
  gravityGroup.add(gravityCoreGlow);
}

function createGravityOrbitRings() {
  CONFIG.gravity.orbitRings.forEach((cfg) => {
    const geo = new THREE.TorusGeometry(cfg.radius, 0.02, 8, 64);
    const mat = new THREE.MeshBasicMaterial({
      color: 0xffcf9e,
      transparent: true,
      opacity: 0.22,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const ring = new THREE.Mesh(geo, mat);
    ring.rotation.x = cfg.tiltX;
    ring.rotation.z = cfg.tiltZ;
    ring.userData = { radius: cfg.radius, occupied: false, baseOpacity: 0.22 };
    gravityGroup.add(ring);
    gravityOrbitRings.push(ring);
  });
}

function idealOrbitSpeed(radius) {
  return Math.sqrt((CONFIG.gravity.G * CONFIG.gravity.coreMass) / radius);
}

function createGravityNuclei() {
  const count = CONFIG.gravity.nucleusCount;
  for (let i = 0; i < count; i++) {
    const mass = 0.6 + Math.random() * 1.6;
    const radius = 0.14 + mass * 0.05;
    const dist = 3.5 + Math.random() * 4.5;
    const theta = Math.random() * Math.PI * 2;
    const y = (Math.random() - 0.5) * 3;
    const pos = new THREE.Vector3(Math.cos(theta) * dist, y, Math.sin(theta) * dist);

    // a roughly-tangential starting velocity, deliberately imprecise —
    // the player has to correct it into a real orbit
    const tangent = new THREE.Vector3(-pos.z, 0, pos.x).normalize();
    const speed = idealOrbitSpeed(dist) * (0.55 + Math.random() * 0.9);
    const velocity = tangent.multiplyScalar(speed).add(
      new THREE.Vector3((Math.random() - 0.5) * 0.4, (Math.random() - 0.5) * 0.6, (Math.random() - 0.5) * 0.4)
    );

    const geo = new THREE.IcosahedronGeometry(radius, 1);
    const mat = new THREE.MeshStandardMaterial({
      color: 0x2a1408,
      emissive: 0xff9a4d,
      emissiveIntensity: 0.7,
      flatShading: true,
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.copy(pos);

    const haloMat = new THREE.SpriteMaterial({
      map: makeGlowTexture(),
      color: 0xffb37a,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const halo = new THREE.Sprite(haloMat);
    halo.scale.set(radius * 6, radius * 6, 1);
    mesh.add(halo);

    mesh.userData = {
      id: i,
      velocity,
      mass,
      radius,
      halo,
      locked: false,
      lockedRing: null,
      orbitTimer: 0,
      merging: false,
    };

    gravityGroup.add(mesh);
    gravityNuclei.push(mesh);
  }
}

/* ----------------------------------------------------------
   Physics (sections 7, 30) — simplified, delta-time based
---------------------------------------------------------- */
function updateGravityPhysics(delta) {
  if (activeZone !== 'gravity' || zoneTransition) return;
  const cfg = CONFIG.gravity;
  const dt = Math.min(delta, 0.05); // clamp to avoid big jumps after a tab switch

  gravityNuclei.forEach((n) => {
    if (n.userData.merging) return;
    const ud = n.userData;

    if (ud.locked && !gravityCompletion) {
      // locked nuclei coast on a clean analytic circular orbit instead of
      // accumulating simulation error — this is what keeps them "in place"
      const ring = ud.lockedRing;
      const speed = idealOrbitSpeed(ring.userData.radius);
      ud.orbitAngle += (speed / ring.userData.radius) * dt;
      const localPos = new THREE.Vector3(
        Math.cos(ud.orbitAngle) * ring.userData.radius,
        Math.sin(ud.orbitAngle) * ring.userData.radius,
        0
      ).applyEuler(ring.rotation);
      n.position.copy(localPos);
      return;
    }

    if (n === draggedNucleus) {
      // player-controlled cursor field (attract or repulse)
      const dir = cursorFieldWorld.clone().sub(n.position);
      const dist = Math.max(dir.length(), 0.3);
      if (dist < cfg.cursorFieldRadius) {
        const strength = cfg.cursorFieldStrength * (1 - dist / cfg.cursorFieldRadius);
        const sign = shiftHeld ? -1 : 1;
        ud.velocity.add(dir.normalize().multiplyScalar(sign * strength * dt));
      }
    }

    // gravity toward the core (local space, core sits at origin)
    const toCore = n.position.clone().negate();
    const dist = Math.max(toCore.length(), 0.6);
    const forceMag = (cfg.G * cfg.coreMass * ud.mass) / (dist * dist);
    const accel = toCore.normalize().multiplyScalar(forceMag / ud.mass);
    ud.velocity.add(accel.multiplyScalar(dt));

    // gentle friction so the system settles rather than spiraling forever
    const frictionFactor = Math.exp(-cfg.friction * dt);
    ud.velocity.multiplyScalar(frictionFactor);

    n.position.add(ud.velocity.clone().multiplyScalar(dt));

    checkOrbit(n, dt);
  });

  checkGravityCollisions();
}

function checkOrbit(nucleus, dt) {
  const cfg = CONFIG.gravity;
  const ud = nucleus.userData;
  const dist = nucleus.position.length();
  const speed = ud.velocity.length();

  let matchedRing = null;
  gravityOrbitRings.forEach((ring) => {
    if (ring.userData.occupied) return;
    const radiusOk = Math.abs(dist - ring.userData.radius) < cfg.orbitRadiusTolerance;
    const ideal = idealOrbitSpeed(ring.userData.radius);
    const speedOk = Math.abs(speed - ideal) / ideal < cfg.orbitSpeedTolerance;
    if (radiusOk && speedOk) matchedRing = ring;
  });

  if (matchedRing) {
    ud.orbitTimer += dt;
    if (ud.orbitTimer >= cfg.lockDuration) {
      lockNucleusIntoOrbit(nucleus, matchedRing);
    }
  } else {
    ud.orbitTimer = Math.max(0, ud.orbitTimer - dt * 2);
  }
}

function checkStillLocked(nucleus) {
  // no-op: locked nuclei now orbit analytically (see updateGravityPhysics)
}

function lockNucleusIntoOrbit(nucleus, ring) {
  const ud = nucleus.userData;
  ud.locked = true;
  ud.lockedRing = ring;
  ring.userData.occupied = true;

  // snap onto the ring's own (possibly tilted) plane for a clean, stable orbit
  const r = ring.userData.radius;
  ud.orbitAngle = Math.atan2(nucleus.position.z, nucleus.position.x);
  const localPos = new THREE.Vector3(
    Math.cos(ud.orbitAngle) * r,
    Math.sin(ud.orbitAngle) * r,
    0
  ).applyEuler(ring.rotation);
  nucleus.position.copy(localPos);
  ud.velocity.set(0, 0, 0);

  spawnGravityPulse(localPos.clone());
  ring.userData.pulseUntil = clock.getElapsedTime() + 1.0;

  gravityState.lockedCount = gravityOrbitRings.filter((r2) => r2.userData.occupied).length;
  gravityState.stability = gravityState.lockedCount / gravityOrbitRings.length;
  saveGame();

  if (gravityState.lockedCount >= gravityOrbitRings.length && !gravityCompletion && !gravitySeedGroup) {
    triggerGravityCompletion();
  }
}

function spawnGravityPulse(position) {
  const geo = new THREE.SphereGeometry(0.05, 8, 8);
  const mat = new THREE.MeshBasicMaterial({
    color: 0xffffff,
    transparent: true,
    opacity: 1,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  const pulse = new THREE.Mesh(geo, mat);
  pulse.position.copy(position);
  gravityGroup.add(pulse);
  const startTime = clock.getElapsedTime();
  function grow() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.8, 1);
    const s = 1 + p * 10;
    pulse.scale.setScalar(s);
    mat.opacity = 1 - p;
    if (p < 1) {
      requestAnimationFrame(grow);
    } else {
      gravityGroup.remove(pulse);
      geo.dispose();
      mat.dispose();
    }
  }
  grow();
}

/* ----------------------------------------------------------
   Collisions & fusion (sections 16, 17)
---------------------------------------------------------- */
function checkGravityCollisions() {
  for (let i = 0; i < gravityNuclei.length; i++) {
    const a = gravityNuclei[i];
    if (a.userData.merging || a.userData.locked) continue;
    for (let j = i + 1; j < gravityNuclei.length; j++) {
      const b = gravityNuclei[j];
      if (b.userData.merging || b.userData.locked) continue;
      const dist = a.position.distanceTo(b.position);
      if (dist < (a.userData.radius + b.userData.radius) * CONFIG.gravity.mergeFactor) {
        mergeNuclei(a, b);
        return; // one merge per frame keeps things predictable
      }
    }
  }
}

function mergeNuclei(a, b) {
  const big = a.userData.mass >= b.userData.mass ? a : b;
  const small = big === a ? b : a;
  big.userData.merging = true;
  small.userData.merging = true;

  const startTime = clock.getElapsedTime();
  const startBig = big.position.clone();
  const startSmall = small.position.clone();

  function spiral() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.6, 1);
    const mid = startBig.clone().lerp(startSmall, 0.5 * p);
    small.position.lerpVectors(startSmall, mid, p);
    small.scale.setScalar(1 - p);
    if (p < 1) {
      requestAnimationFrame(spiral);
    } else {
      gravityGroup.remove(small);
      gravityNuclei = gravityNuclei.filter((n) => n !== small);

      const newMass = big.userData.mass + small.userData.mass;
      const newRadius = Math.cbrt(
        Math.pow(big.userData.radius, 3) + Math.pow(small.userData.radius, 3)
      );
      big.userData.mass = newMass;
      big.userData.radius = newRadius;
      big.userData.merging = false;
      const s = newRadius / (big.geometry.parameters.radius || newRadius);
      big.scale.setScalar(Math.max(1, s));
      spawnGravityPulse(big.position.clone());
    }
  }
  spiral();
}

/* ----------------------------------------------------------
   Attract / repulse dragging (sections 9, 10, 11)
---------------------------------------------------------- */
const cursorFieldWorld = new THREE.Vector3();

function updateCursorFieldWorld(clientX, clientY, depth) {
  raycastPoint.set(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(raycastPoint, camera);
  const worldPos = raycaster.ray.origin.clone().add(
    raycaster.ray.direction.clone().multiplyScalar(depth)
  );
  cursorFieldWorld.copy(gravityGroup.worldToLocal(worldPos));
}

/* ----------------------------------------------------------
   Completion (sections 18–21): stability reaches 100%
---------------------------------------------------------- */
function triggerGravityCompletion() {
  gravityCompletion = { startTime: clock.getElapsedTime() };
}

function updateGravityCompletionAnim(t) {
  if (!gravityCompletion) return;
  const age = t - gravityCompletion.startTime;

  if (age < 0.6) {
    // step 1 — the system briefly freezes
  } else if (age < 1.6) {
    const p = (age - 0.6) / 1.0;
    gravityCore.material.emissiveIntensity = 0.9 + p * 3;
    gravityCoreGlow.material.opacity = 0.3 + p * 0.6;
    gravityOrbitRings.forEach((r) => (r.material.opacity = 0.22 + p * 0.5));
  } else if (age < 2.4) {
    if (!gravityCompletion.pulled) {
      gravityCompletion.pulled = true;
      gravityNuclei.forEach((n) => spawnGravityPulse(n.position.clone()));
    }
    const p = (age - 1.6) / 0.8;
    gravityNuclei.forEach((n) => {
      n.position.lerp(new THREE.Vector3(0, 0, 0), p * 0.02);
    });
  } else {
    if (!gravityCompletion.seedSpawned) {
      gravityCompletion.seedSpawned = true;
      spawnGravitySeed();
    }
    gravityCompletion = null;
  }
}

function spawnGravitySeed() {
  gravitySeedGroup = new THREE.Group();
  const geo = new THREE.IcosahedronGeometry(0.3, 1);
  const mat = new THREE.MeshStandardMaterial({
    color: 0xffffff,
    emissive: 0xffb066,
    emissiveIntensity: 1.3,
    flatShading: true,
  });
  gravitySeedGroup.add(new THREE.Mesh(geo, mat));

  const glowGeo = new THREE.IcosahedronGeometry(0.55, 1);
  const glowMat = new THREE.MeshBasicMaterial({
    color: 0xff8a3d,
    transparent: true,
    opacity: 0.35,
    side: THREE.BackSide,
    blending: THREE.AdditiveBlending,
    depthWrite: false,
  });
  gravitySeedGroup.add(new THREE.Mesh(glowGeo, glowMat));

  gravitySeedGroup.scale.setScalar(0);
  gravityGroup.add(gravitySeedGroup);
  showCenterMessage('GRAVITY SEED FORMED');

  const startTime = clock.getElapsedTime();
  function grow() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 1.4, 1);
    const eased = 1 - Math.pow(1 - p, 3);
    gravitySeedGroup.scale.setScalar(eased);
    if (p < 1) requestAnimationFrame(grow);
  }
  grow();
}

function collectGravitySeed() {
  if (!gravitySeedGroup || gravitySeedGroup.userData.collected) return;
  gravitySeedGroup.userData.collected = true;
  spawnCursorRipple();

  const startPos = gravitySeedGroup.position.clone();
  const startTime = clock.getElapsedTime();
  function collectAnim() {
    const p = Math.min((clock.getElapsedTime() - startTime) / 0.7, 1);
    const eased = p * p;
    gravitySeedGroup.position.lerpVectors(startPos, camera.position, eased * 0.5);
    gravitySeedGroup.scale.setScalar(Math.max(0, 1 - eased));
    if (p < 1) {
      requestAnimationFrame(collectAnim);
    } else {
      gravitySeedGroup.visible = false;
      gameState.collectedGravitySeeds += 1;
      updateFragmentUI();
      saveGame();
      gravityReturnPortalGroup.visible = true;
    }
  }
  collectAnim();
}

function createGravityReturnPortalObject() {
  gravityReturnPortalGroup = new THREE.Group();
  gravityReturnPortalGroup.position.set(0, -2.5, 6);
  gravityReturnPortalGroup.visible = false;

  const ringGeo = new THREE.TorusGeometry(1.1, 0.06, 10, 48);
  const ringMat = new THREE.MeshBasicMaterial({

  });
  gravityReturnPortalGroup.add(new THREE.Mesh(ringGeo, ringMat));

  const discGeo = new THREE.CircleGeometry(1.0, 32);

    depthWrite: false,
  });

/* ----------------------------------------------------------
   Hidden secret (sections 25, 26): hold shift, pull 3+ nuclei
   close together near the cursor, then release them all at once
---------------------------------------------------------- */
function updateGravitySecretWatch() {
  if (!shiftHeld || !draggedNucleus) {
    secretDrag.active = false;
    return;
  }
  secretDrag.active = true;
  let closeCount = 0;
  gravityNuclei.forEach((n) => {
    if (n.position.distanceTo(cursorFieldWorld) < CONFIG.gravity.secretHoldRadius) {
      closeCount += 1;
    }
  });
  if (closeCount >= CONFIG.gravity.secretRequiredCount) {
    secretDrag.readyToFire = true;
  }
}

function checkSecretRelease() {
  if (secretDrag.readyToFire && !gameState.secretsFound.includes('gravity_hidden_signal')) {
    gameState.secretsFound.push('gravity_hidden_signal');
    spawnGravityPulse(cursorFieldWorld.clone());
    // an extremely subtle acknowledgement — no explanation
    gravityCoreGlow.material.opacity = Math.min(gravityCoreGlow.material.opacity + 0.15, 0.7);
    saveGame();
  }
  secretDrag.readyToFire = false;
  secretDrag.active = false;
}

/* ----------------------------------------------------------
   UI hint sequence (section 33): PULL, then RELEASE
---------------------------------------------------------- */
function showGravityFirstHint() {
  if (hasSeenGravityHint) return;
  hasSeenGravityHint = true;
  const hint = document.getElementById('drag-hint');
  hint.textContent = 'PULL';
  hint.classList.remove('hidden');
  setTimeout(() => {
    hint.textContent = 'RELEASE';
  }, 2200);
  setTimeout(() => {
    hint.classList.add('hidden');
  }, 4400);
}

/* ----------------------------------------------------------
   Per-frame gravity zone update
---------------------------------------------------------- */
function updateGravityZone(t, delta) {
  if (activeZone !== 'gravity' && !zoneTransition) return;

  gravityCore.rotation.y += 0.002;
  const breathe = 1 + Math.sin(t * 0.4) * 0.04 + gravityState.stability * 0.05;
  gravityCoreGlow.scale.setScalar(breathe);
  if (!gravityCompletion) {
    gravityCore.material.emissiveIntensity = 0.9 + gravityState.stability * 0.8;
  }

  gravityOrbitRings.forEach((ring) => {
    ring.rotation.z += 0.002;
    if (ring.userData.pulseUntil && t < ring.userData.pulseUntil) {
      ring.material.opacity = 0.5 + Math.sin(t * 10) * 0.2;
    } else {
      ring.material.opacity = ring.userData.occupied ? 0.5 : ring.userData.baseOpacity;
    }
  });

  gravityNuclei.forEach((n) => {
    const isHovered = n === hoveredNucleus;
    const s = isHovered ? 1.3 : n.userData.locked ? 1.1 : 1;
    n.scale.setScalar(s * (n.userData.merging ? n.scale.x : 1));
    n.userData.halo.material.opacity = n.userData.locked ? 0.6 : isHovered ? 0.6 : 0.3;
    n.rotation.y += 0.01;
  });

  if (gravitySeedGroup && gravitySeedGroup.visible && !gravitySeedGroup.userData.collected) {
    gravitySeedGroup.rotation.y += 0.012;
    gravitySeedGroup.position.y = 0.4 + Math.sin(t * 0.9) * 0.2;
  }

  if (gravityReturnPortalGroup && gravityReturnPortalGroup.visible) {
    gravityReturnPortalGroup.children[0].rotation.z += 0.006;
    gravityReturnPortalDisc.material.opacity = 0.2 + Math.sin(t * 1.5) * 0.05;
  }

  updateGravityPhysics(delta);
  updateGravityCompletionAnim(t);
}

/* ----------------------------------------------------------
   Persistence (section 25)
---------------------------------------------------------- */
const SAVE_KEY = 'interactiveUniverseSave';

function saveGame() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify({
      discoveredNodes: gameState.discoveredNodes,
      discoveries: gameState.discoveries,
      unlocked: gameState.unlocked,
      crystalCollected: gameState.crystalCollected,
      collectedFragments: gameState.collectedFragments,
      portalActive: gameState.portalActive,
      secretZoneRevealed: gameState.secretZoneRevealed,
      collectedCores: gameState.collectedCores,
      constellationProgress: gameState.constellationProgress,
      // V4
      gravityUnlocked: gameState.gravityUnlocked,
      collectedGravitySeeds: gameState.collectedGravitySeeds,
      secretsFound: gameState.secretsFound,
      gravityLockedRings: gravityOrbitRings
        .map((r, i) => (r.userData.occupied ? i : null))
        .filter((i) => i !== null),
    }));
  } catch (e) {
    /* localStorage unavailable — progress just won't persist */
  }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch (e) {
    return null;
  }
}

function applyLoadedState(saved) {
  if (!saved) return;

  // discovery nodes — reapply instantly, no animation
  (saved.discoveredNodes || []).forEach((id) => {
    const node = nodeMeshes.find((n) => n.userData.id === id);
    if (node && !node.userData.discovered) {
      node.userData.discovered = true;
      node.material.color.setHex(CONFIG.nodes.activeColor);
      node.material.opacity = 1;
      node.userData.halo.material.opacity = 0.8;
    }
  });
  gameState.discoveredNodes = saved.discoveredNodes || [];
  gameState.discoveries = saved.discoveries || 0;

  if (saved.unlocked) {
    gameState.unlocked = true;
    crystalGroup.userData.spawnTime = 0;
    crystalGroup.scale.setScalar(saved.crystalCollected ? 0 : 1);
    if (saved.crystalCollected) {
      crystalGroup.userData.collected = true;
      crystalGroup.visible = false;
      gameState.crystalCollected = true;
    }
  }

  if (saved.collectedFragments >= 1) {
    gameState.collectedFragments = saved.collectedFragments;
    orbitalObjects.fragment.userData.collected = true;
    orbitalObjects.fragment.visible = false;
  }

  if (saved.secretZoneRevealed) gameState.secretZoneRevealed = true;

  if (saved.portalActive) {
    gameState.portalActive = true;
    portalGroup.userData.active = true;
    portalDisc.material.opacity = 0.25;
    portalParticles.material.opacity = 0.6;
  }

  if (saved.collectedCores >= 1) {
    gameState.collectedCores = saved.collectedCores;
    spawnHubCoreObject();
  }

  // constellation connections already solved before
  (saved.constellationProgress || []).forEach((key) => {
    if (connectedPairs.has(key)) return;
    const [a, b] = key.split('-').map(Number);
    const pointA = constellationPoints[a];
    const pointB = constellationPoints[b];
    if (!pointA || !pointB) return;
    connectedPairs.add(key);
    pointA.userData.connected = true;
    pointB.userData.connected = true;
    constellationLines.add(makeConnectionLine(pointA, pointB));
  });
  gameState.constellationProgress = Array.from(connectedPairs);
  if (connectedPairs.size >= CONFIG.constellation.solution.length && !coreRewardGroup) {
    coreMesh.visible = false;
    coreGlow.visible = false;
    spawnCoreReward();
    coreRewardGroup.scale.setScalar(1);
    if (saved.collectedCores >= 1) {
      coreRewardGroup.visible = false;
      coreRewardGroup.userData.collected = true;
    } else {
      revealReturnPortal();
    }
  }

  updateFragmentUI();
  // V4 restoration
  if (saved.gravityUnlocked) {
    gameState.gravityUnlocked = true;
    orbitalObjects.gravity.visible = true;
  }
  gameState.secretsFound = saved.secretsFound || [];
  if (saved.collectedGravitySeeds >= 1) {
    gameState.collectedGravitySeeds = saved.collectedGravitySeeds;
  }
  (saved.gravityLockedRings || []).forEach((ringIndex) => {
    const ring = gravityOrbitRings[ringIndex];
    const nucleus = gravityNuclei.find((n) => !n.userData.locked);
    if (!ring || !nucleus || ring.userData.occupied) return;
    lockNucleusIntoOrbit(nucleus, ring);
  });
  if (
    saved.gravityLockedRings &&
    saved.gravityLockedRings.length >= gravityOrbitRings.length &&
    saved.collectedGravitySeeds >= 1
  ) {
    // the puzzle was already solved and its reward already collected —
    // nothing left to spawn in that zone
  } else if (
    saved.gravityLockedRings &&
    saved.gravityLockedRings.length >= gravityOrbitRings.length
  ) {
    spawnGravitySeed();
    gravitySeedGroup.scale.setScalar(1);
    gravityReturnPortalGroup.visible = true;
  }

  // always resume in the hub — simplest and safest starting point
  enterZone('hub');
}

/* ================================================================
   INTERACTION STATE
================================================================ */
const pointer = { x: 0, y: 0, normX: 0, normY: 0 };
const drag = {
  active: false,
  lastX: 0,
  lastY: 0,
  velX: 0,
  velY: 0,
};
let hasInteracted = false;

// V2 — a single pointer can only be doing one of these at a time
let interactionMode = null; // null | 'rotate' | 'charge' | 'drag-shard'
const charge = { target: null, startTime: 0, startX: 0, startY: 0 };

const cameraRig = {
  distance: CONFIG.camera.startDistance,
  targetDistance: CONFIG.camera.startDistance,
  parallaxX: 0,
  parallaxY: 0,
};

const raycaster = new THREE.Raycaster();
const raycastPoint = new THREE.Vector2();
let hoveredNode = null;
let hoveredCrystal = false;
// V2 — hover targets for the new system objects
let hoveredOrbital = null;   // fragment / secondary / mystery group
let hoveredShard = false;
let hoveredPortal = false;
let hoveredMicroSymbol = false;

function getRotationTarget() {
  if (activeZone === 'constellation') return constellationGroup;
  if (activeZone === 'gravity') return gravityGroup;
  return worldGroup;
}

/* ================================================================
   POINTER / DRAG (mouse + touch unified via Pointer Events)
============================================================== */
function setupPointerEvents() {
  const canvas = document.getElementById('scene');

  canvas.addEventListener('pointerdown', (e) => {
    updatePointerPosition(e.clientX, e.clientY);
    updateHover();
    canvas.setPointerCapture(e.pointerId);

    if (activeZone === 'constellation' && hoveredConstellationPoint) {
      interactionMode = 'connect';
      connecting = { fromPoint: hoveredConstellationPoint };
      const p = hoveredConstellationPoint.position.clone();
      tempConnectLine.geometry.setFromPoints([p, p.clone()]);
      tempConnectLine.material.opacity = 0.7;
      tempConnectLine.visible = true;
      document.getElementById('cursor-ring').classList.add('connecting');
    } else if (activeZone === 'gravity' && hoveredNucleus) {
      interactionMode = 'gravity-drag';
      draggedNucleus = hoveredNucleus;
      const worldPos = new THREE.Vector3();
      draggedNucleus.getWorldPosition(worldPos);
      updateCursorFieldWorld(e.clientX, e.clientY, camera.position.distanceTo(worldPos));
      secretDrag.shiftAtStart = shiftHeld;
    } else if (activeZone === 'hub' && hoveredShard) {
      interactionMode = 'drag-shard';
      shardMesh.userData.carried = true;
    } else if (activeZone === 'hub' && hoveredOrbital && hoveredOrbital.userData.requiresHold) {
      interactionMode = 'charge';
      charge.target = hoveredOrbital;
      charge.startTime = clock.getElapsedTime();
      charge.startX = e.clientX;
      charge.startY = e.clientY;
    } else {
      interactionMode = 'rotate';
      drag.active = true;
      drag.lastX = e.clientX;
      drag.lastY = e.clientY;
    }
    setCursorPressed(true);
  });

  canvas.addEventListener('pointermove', (e) => {
    updatePointerPosition(e.clientX, e.clientY);

    if (interactionMode === 'rotate' && drag.active) {
      const target = getRotationTarget();
      const dx = e.clientX - drag.lastX;
      const dy = e.clientY - drag.lastY;
      drag.velX = dx * CONFIG.rotation.dragSensitivity;
      drag.velY = dy * CONFIG.rotation.dragSensitivity;
      target.rotation.y += drag.velX;
      target.rotation.x = THREE.MathUtils.clamp(
        target.rotation.x + drag.velY,
        -1.1,
        1.1
      );
      drag.lastX = e.clientX;
      drag.lastY = e.clientY;
      registerFirstInteraction();
    } else if (interactionMode === 'drag-shard') {
      dragShardTo(e.clientX, e.clientY);
    } else if (interactionMode === 'charge') {
      const dx = e.clientX - charge.startX;
      const dy = e.clientY - charge.startY;
      if (Math.sqrt(dx * dx + dy * dy) > CONFIG.charge.cancelDrift) {
        cancelCharge();
      }
    } else if (interactionMode === 'connect') {
      updateConnectDrag(e.clientX, e.clientY);
      registerFirstInteractionConstellation();
    } else if (interactionMode === 'gravity-drag' && draggedNucleus) {
      const worldPos = new THREE.Vector3();
      draggedNucleus.getWorldPosition(worldPos);
      updateCursorFieldWorld(e.clientX, e.clientY, camera.position.distanceTo(worldPos));
      updateGravitySecretWatch();
      registerFirstInteraction();
    }
  });

  window.addEventListener('pointerup', (e) => {
    if (interactionMode === 'drag-shard') {
      releaseShard();
    } else if (interactionMode === 'charge') {
      resolveCharge();
    } else if (interactionMode === 'connect') {
      resolveConnectDrag(e.clientX, e.clientY);
    } else if (interactionMode === 'gravity-drag') {
      checkSecretRelease();
      draggedNucleus = null;
    }
    document.getElementById('cursor-ring').classList.remove('connecting');
    interactionMode = null;
    drag.active = false;
    setCursorPressed(false);
  });

  canvas.addEventListener('pointerleave', () => {
    if (interactionMode === 'charge') cancelCharge();
    if (interactionMode === 'connect') rejectConnection();
    if (interactionMode === 'gravity-drag') draggedNucleus = null;
    drag.active = false;
  });

  window.addEventListener('keydown', (e) => {
    if (e.key === 'Shift') {
      shiftHeld = true;
      document.getElementById('cursor-ring').classList.add('repulse');
    }
  });
  window.addEventListener('keyup', (e) => {
    if (e.key === 'Shift') {
      shiftHeld = false;
      document.getElementById('cursor-ring').classList.remove('repulse');
    }
  });

  // click (as opposed to drag) triggers node/crystal/fragment/portal activation
  canvas.addEventListener('click', (e) => {
    handleClick(e.clientX, e.clientY);
  });

  // desktop zoom
  canvas.addEventListener(
    'wheel',
    (e) => {
      e.preventDefault();
      cameraRig.targetDistance = THREE.MathUtils.clamp(
        cameraRig.targetDistance + e.deltaY * CONFIG.camera.zoomStep * cameraRig.targetDistance,
        CONFIG.camera.minDistance,
        CONFIG.camera.maxDistance
      );
      registerFirstInteraction();
    },
    { passive: false }
  );

  // basic pinch-to-zoom for touch
  let pinchStartDist = null;
  canvas.addEventListener('touchstart', (e) => {
    if (e.touches.length === 2) {
      pinchStartDist = touchDistance(e.touches);
    }
  }, { passive: true });

  canvas.addEventListener('touchmove', (e) => {
    if (e.touches.length === 2 && pinchStartDist) {
      const dist = touchDistance(e.touches);
      const delta = pinchStartDist - dist;
      cameraRig.targetDistance = THREE.MathUtils.clamp(
        cameraRig.targetDistance + delta * 0.03,
        CONFIG.camera.minDistance,
        CONFIG.camera.maxDistance
      );
      pinchStartDist = dist;
      registerFirstInteraction();
    }
  }, { passive: true });

  window.addEventListener('resize', onResize);
}

function touchDistance(touches) {
  const dx = touches[0].clientX - touches[1].clientX;
  const dy = touches[0].clientY - touches[1].clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

function updatePointerPosition(clientX, clientY) {
  pointer.x = clientX;
  pointer.y = clientY;
  pointer.normX = (clientX / window.innerWidth) * 2 - 1;
  pointer.normY = -(clientY / window.innerHeight) * 2 + 1;

  const dot = document.getElementById('cursor-dot');
  const ring = document.getElementById('cursor-ring');
  if (dot && ring) {
    dot.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, -50%)`;
    ring.style.transform = `translate(${clientX}px, ${clientY}px) translate(-50%, -50%)`;
  }
}

function setCursorPressed(pressed) {
  document.getElementById('cursor-ring').classList.toggle('press', pressed);
}

/* ----------------------------------------------------------
   V2 — shard drag & drop (section 15)
---------------------------------------------------------- */
function dragShardTo(clientX, clientY) {
  raycastPoint.set(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(raycastPoint, camera);
  // project onto a plane at the shard's current depth from the camera
  const depth = camera.position.distanceTo(shardMesh.position);
  const worldPos = raycaster.ray.origin.clone().add(
    raycaster.ray.direction.clone().multiplyScalar(depth)
  );
  shardMesh.position.copy(worldPos);
  registerFirstInteraction();
}

function releaseShard() {
  shardMesh.userData.carried = false;
  const portalWorldPos = new THREE.Vector3();
  portalGroup.getWorldPosition(portalWorldPos);
  const dropDistance = shardMesh.position.distanceTo(portalWorldPos);

  if (dropDistance < CONFIG.portal.radius * 1.3) {
    settleShardAtPortal();
  } else {
    returnShardHome();
  }
}

/* ----------------------------------------------------------
   V2 — hold-to-charge (section 14)
---------------------------------------------------------- */
function cancelCharge() {
  if (charge.target) {
    charge.target.userData.chargeProgress = 0;
  }
  charge.target = null;
  interactionMode = null;
}

function resolveCharge() {
  if (!charge.target) return;
  const held = clock.getElapsedTime() - charge.startTime;
  if (held >= CONFIG.charge.holdDuration) {
    activateMysteryLight(charge.target);
  }
  charge.target.userData.chargeProgress = 0;
  charge.target = null;
}

function activateMysteryLight(obj) {
  if (obj.userData.activated) return;
  obj.userData.activated = true;
  obj.children[0].material.emissiveIntensity = 3;
  obj.userData.halo.material.opacity = 0.9;
  gameState.energy += 2;
  gameState.secretZoneRevealed = true;
  spawnCursorRipple();
  showCenterMessage('SIGNAL ACQUIRED');
  updateWorldState();
}

function registerFirstInteraction() {
  if (hasInteracted) return;
  hasInteracted = true;
  if (activeZone === 'hub') document.getElementById('drag-hint').classList.add('hidden');
}

function registerFirstInteractionConstellation() {
  if (hasInteractedConstellation) return;
  hasInteractedConstellation = true;
  if (activeZone === 'constellation') document.getElementById('drag-hint').classList.add('hidden');
}

function onResize() {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
}

/* ================================================================
   RAYCAST HOVER — dispatches to the active zone's own hover logic
============================================================ */
function updateHover() {
  if (zoneTransition) return;
  if (activeZone === 'constellation') {
    updateConstellationHover();
  } else if (activeZone === 'gravity') {
    updateGravityHover();
  } else {
    updateHubHover();
  }
}

function updateHubHover() {
  raycastPoint.set(pointer.normX, pointer.normY);
  raycaster.setFromCamera(raycastPoint, camera);

  const targets = nodeMeshes.slice();
  if (crystalGroup && crystalGroup.userData.spawnTime !== null && !crystalGroup.userData.collected) {
    targets.push(crystalGroup.children[0]);
  }
  // V2 targets
  Object.values(orbitalObjects).forEach((obj) => {
    if (!obj.userData.collected && obj.visible) targets.push(obj.children[0]);
  });
  if (shardMesh && shardMesh.visible && !shardMesh.userData.carried) {
    targets.push(shardMesh);
  }
  if (portalGroup && portalGroup.userData.active) {
    targets.push(portalDisc);
  }
  if (microSymbol && microSymbol.visible) {
    targets.push(microSymbol);
  }

  const intersects = raycaster.intersectObjects(targets, false);
  const ring = document.getElementById('cursor-ring');

  hoveredNode = null;
  hoveredCrystal = false;
  hoveredOrbital = null;
  hoveredShard = false;
  hoveredPortal = false;
  hoveredMicroSymbol = false;

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    ring.classList.add('hover');

    if (obj.parent === crystalGroup) {
      hoveredCrystal = true;
    } else if (obj === shardMesh) {
      hoveredShard = true;
    } else if (obj === portalDisc) {
      hoveredPortal = true;
    } else if (obj === microSymbol) {
      hoveredMicroSymbol = true;
    } else if (obj.parent && obj.parent.userData && obj.parent.userData.name) {
      hoveredOrbital = obj.parent;
    } else {
      hoveredNode = obj;
    }
  } else {
    ring.classList.remove('hover');
  }
}

/* V3 — hover for the constellation zone: points, the core reward, the return portal */
function updateConstellationHover() {
  raycastPoint.set(pointer.normX, pointer.normY);
  raycaster.setFromCamera(raycastPoint, camera);

  const targets = constellationPoints.slice();
  if (coreRewardGroup && coreRewardGroup.visible && !coreRewardGroup.userData.collected) {
    targets.push(coreRewardGroup.children[0]);
  }
  if (returnPortalGroup && returnPortalGroup.visible) {
    targets.push(returnPortalDisc);
  }

  const intersects = raycaster.intersectObjects(targets, false);
  const ring = document.getElementById('cursor-ring');

  hoveredConstellationPoint = null;
  hoveredCoreReward = false;
  hoveredReturnPortal = false;

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    ring.classList.add('hover');
    if (coreRewardGroup && obj.parent === coreRewardGroup) {
      hoveredCoreReward = true;
    } else if (obj === returnPortalDisc) {
      hoveredReturnPortal = true;
    } else {
      hoveredConstellationPoint = obj;
    }
  } else {
    ring.classList.remove('hover');
  }
}

/* V4 — hover for the gravity zone: nuclei, the seed, the return portal */
function updateGravityHover() {
  raycastPoint.set(pointer.normX, pointer.normY);
  raycaster.setFromCamera(raycastPoint, camera);

  const targets = gravityNuclei.slice();
  if (gravitySeedGroup && gravitySeedGroup.visible && !gravitySeedGroup.userData.collected) {
    targets.push(gravitySeedGroup.children[0]);
  }
  if (gravityReturnPortalGroup && gravityReturnPortalGroup.visible) {
    targets.push(gravityReturnPortalDisc);
  }

  const intersects = raycaster.intersectObjects(targets, false);
  const ring = document.getElementById('cursor-ring');

  hoveredNucleus = null;
  hoveredGravitySeed = false;
  hoveredGravityReturnPortal = false;

  if (intersects.length > 0) {
    const obj = intersects[0].object;
    ring.classList.add('hover');
    if (gravitySeedGroup && obj.parent === gravitySeedGroup) {
      hoveredGravitySeed = true;
    } else if (obj === gravityReturnPortalDisc) {
      hoveredGravityReturnPortal = true;
    } else {
      hoveredNucleus = obj;
    }
  } else {
    ring.classList.remove('hover');
  }
}

/* ----------------------------------------------------------
   V3 — drag-to-connect (sections 8, 9, 10)
---------------------------------------------------------- */
function updateConnectDrag(clientX, clientY) {
  if (!connecting) return;
  raycastPoint.set(
    (clientX / window.innerWidth) * 2 - 1,
    -(clientY / window.innerHeight) * 2 + 1
  );
  raycaster.setFromCamera(raycastPoint, camera);

  const fromWorld = new THREE.Vector3();
  connecting.fromPoint.getWorldPosition(fromWorld);
  const depth = camera.position.distanceTo(fromWorld);
  const worldPos = raycaster.ray.origin.clone().add(
    raycaster.ray.direction.clone().multiplyScalar(depth)
  );
  const localPos = constellationGroup.worldToLocal(worldPos.clone());

  tempConnectLine.geometry.setFromPoints([
    connecting.fromPoint.position.clone(),
    localPos,
  ]);

  // highlight the nearest candidate point within snapping range
  let nearest = null;
  let nearestDist = CONFIG.constellation.connectSnapRadius;
  constellationPoints.forEach((pt) => {
    if (pt === connecting.fromPoint) return;
    const d = pt.position.distanceTo(localPos);
    if (d < nearestDist) {
      nearestDist = d;
      nearest = pt;
    }
  });
  hoveredConstellationPoint = nearest || connecting.fromPoint;
}

function resolveConnectDrag() {
  if (!connecting) return;
  const fromPoint = connecting.fromPoint;
  const toPoint = hoveredConstellationPoint !== fromPoint ? hoveredConstellationPoint : null;
  connecting = null;

  if (toPoint) {
    const key = [fromPoint.userData.id, toPoint.userData.id].sort((a, b) => a - b).join('-');
    const isSolution = CONFIG.constellation.solution.some(
      ([a, b]) => [a, b].sort((x, y) => x - y).join('-') === key
    );
    if (isSolution && !connectedPairs.has(key)) {
      confirmConnection(fromPoint, toPoint);
      tempConnectLine.visible = false;
      return;
    }
  }
  rejectConnection();
}

/* ================================================================
   CLICK HANDLING — zone-aware dispatch
============================================================ */
function handleClick(clientX, clientY) {
  // ignore clicks that were actually part of a drag gesture
  if (Math.abs(drag.velX) > 0.01 || Math.abs(drag.velY) > 0.01) return;
  if (zoneTransition) return;

  updatePointerPosition(clientX, clientY);
  updateHover();

  if (activeZone === 'constellation') {
    if (hoveredCoreReward) {
      collectCoreReward();
    } else if (hoveredReturnPortal) {
      triggerZoneTransition('hub', returnPortalGroup, returnPortalDisc.material);
    }
    registerFirstInteractionConstellation();
    return;
  }

  if (activeZone === 'gravity') {
    if (hoveredGravitySeed) {
      collectGravitySeed();
    } else if (hoveredGravityReturnPortal) {
      triggerZoneTransition('hub', gravityReturnPortalGroup, gravityReturnPortalDisc.material);
    }
    return;
  }

  if (hoveredNode && !hoveredNode.userData.discovered) {
    activateNode(hoveredNode);
  } else if (hoveredCrystal) {
    collectCrystal();
  } else if (hoveredOrbital && hoveredOrbital.userData.name === 'fragment') {
    startFragmentAbsorption(hoveredOrbital);
  } else if (hoveredOrbital && hoveredOrbital.userData.name === 'secondary') {
    // secondary sphere: no state change yet, just a quiet acknowledgement
    hoveredOrbital.userData.halo.material.opacity = 0.7;
  } else if (hoveredOrbital && hoveredOrbital.userData.name === 'gravity') {
    triggerZoneTransition('gravity', orbitalObjects.gravity, orbitalObjects.gravity.children[1].material);
  } else if (hoveredPortal) {
    triggerPortalTransition();
  } else if (hoveredMicroSymbol) {
    activateMicroSymbol();
  }
  registerFirstInteraction();
}

function activateNode(node) {
  node.userData.discovered = true;
  node.material.color.setHex(CONFIG.nodes.activeColor);
  node.material.opacity = 1;
  node.userData.halo.material.opacity = 0.8;
  node.userData.pulseStart = clock.getElapsedTime();

  gameState.discoveredNodes.push(node.userData.id);
  gameState.discoveries += 1;
  gameState.energy += 1;

  spawnSurfaceRipple(node.position.clone());
  spawnCursorRipple();

  const el = document.getElementById('progress-index');
  el.textContent = `${String(gameState.discoveries).padStart(2, '0')} / DISCOVERY`;

  if (gameState.discoveries >= CONFIG.nodes.count && !gameState.unlocked) {
    triggerUnlock();
  }
  updateWorldState();
}

/* expanding ring on the planet surface where a node was activated */
const activeRipples = [];
function spawnSurfaceRipple(position) {
  const geo = new THREE.RingGeometry(0.05, 0.09, 32);
  const mat = new THREE.MeshBasicMaterial({
    color: CONFIG.nodes.activeColor,
    transparent: true,
    opacity: 0.8,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    depthWrite: false,
  });
  const ring = new THREE.Mesh(geo, mat);
  ring.position.copy(position);
  ring.lookAt(position.clone().multiplyScalar(2)); // face outward from planet center
  ring.userData.birth = clock.getElapsedTime();
  planetGroup.add(ring);
  activeRipples.push(ring);
}

function updateSurfaceRipples(t) {
  for (let i = activeRipples.length - 1; i >= 0; i--) {
    const ring = activeRipples[i];
    const age = t - ring.userData.birth;
    const duration = 1.1;
    if (age > duration) {
      planetGroup.remove(ring);
      ring.geometry.dispose();
      ring.material.dispose();
      activeRipples.splice(i, 1);
      continue;
    }
    const p = age / duration;
    const scale = 1 + p * 14;
    ring.scale.set(scale, scale, scale);
    ring.material.opacity = 0.8 * (1 - p);
  }
}

/* small screen-space ripple at cursor, purely cosmetic feedback */
function spawnCursorRipple() {
  const el = document.createElement('div');
  el.className = 'cursor-ripple';
  el.style.left = `${pointer.x}px`;
  el.style.top = `${pointer.y}px`;
  document.body.appendChild(el);
  setTimeout(() => el.remove(), 750);
}

/* ================================================================
   UNLOCK SEQUENCE — triggered once all nodes are discovered
============================================================ */
let unlockTime = null;

function triggerUnlock() {
  gameState.unlocked = true;
  unlockTime = clock.getElapsedTime();

  showCenterMessage('DISCOVERY\u00A0COMPLETE', 4200);

  // reveal the crystal with a soft grow-in
  crystalGroup.userData.spawnTime = unlockTime;
}

function updateUnlockAnimation(t) {
  if (!gameState.unlocked) return;
  const age = t - unlockTime;

  // rings accelerate briefly, then settle back to their base speed
  const boost = Math.max(0, 1 - age / 3);
  ringMeshes.forEach((ring) => {
    ring.rotation.z += ring.userData.speed * (1 + boost * 6);
    ring.material.opacity = ring.userData.baseOpacity * (1 + boost * 1.5);
  });

  // planet pulses once
  const pulse = 1 + Math.max(0, Math.sin(age * 3)) * boost * 0.06;
  planetGroup.scale.set(pulse, pulse, pulse);

  // crystal grows in
  if (crystalGroup.userData.spawnTime !== null && !crystalGroup.userData.collected) {
    const growAge = t - crystalGroup.userData.spawnTime;
    const s = THREE.MathUtils.clamp(growAge / 1.6, 0, 1);
    const eased = 1 - Math.pow(1 - s, 3);
    crystalGroup.scale.set(eased, eased, eased);
  }
}

function collectCrystal() {
  if (crystalGroup.userData.collected) return;
  crystalGroup.userData.collected = true;
  gameState.crystalCollected = true;
  spawnCursorRipple();
  saveGame();

  const startTime = clock.getElapsedTime();
  const startPos = crystalGroup.position.clone();

  function collectAnim() {
    const t = clock.getElapsedTime() - startTime;
    const duration = 0.6;
    const p = Math.min(t / duration, 1);
    const eased = p * p;
    crystalGroup.position.lerpVectors(startPos, camera.position, eased * 0.4);
    const s = Math.max(0, 1 - eased);
    crystalGroup.scale.set(s, s, s);
    if (p < 1) {
      requestAnimationFrame(collectAnim);
    } else {
      crystalGroup.visible = false;
    }
  }
  collectAnim();
}

/* ================================================================
   PER-FRAME UPDATE
============================================================ */
function update(t, delta) {
  // idle drift + inertia decay after drag release
  if (!drag.active) {
    drag.velX *= CONFIG.rotation.damping;
    drag.velY *= CONFIG.rotation.damping;
    if (activeZone === 'hub') {
      worldGroup.rotation.y += drag.velX + CONFIG.rotation.idleSpeed;
      worldGroup.rotation.x = THREE.MathUtils.clamp(
        worldGroup.rotation.x + drag.velY,
        -1.1,
        1.1
      );
    } else if (activeZone === 'constellation') {
      constellationGroup.rotation.y += drag.velX;
      constellationGroup.rotation.x = THREE.MathUtils.clamp(
        constellationGroup.rotation.x + drag.velY,
        -1.1,
        1.1
      );
    } else if (activeZone === 'gravity') {
      gravityGroup.rotation.y += drag.velX;
      gravityGroup.rotation.x = THREE.MathUtils.clamp(
        gravityGroup.rotation.x + drag.velY,
        -1.1,
        1.1
      );
    }
  }

  // rings: slow independent rotation (skipped here during unlock boost, handled above)
  if (!gameState.unlocked) {
    ringMeshes.forEach((ring) => {
      ring.rotation.z += ring.userData.speed;
    });
  } else {
    updateUnlockAnimation(t);
  }

  // gentle breathing scale on the glow shell
  const breathe = 1 + Math.sin(t * 0.5) * 0.015;
  glowMesh.scale.set(breathe, breathe, breathe);

  // node halo pulse for discovered nodes
  nodeMeshes.forEach((node) => {
    if (node.userData.discovered) {
      const s = 1 + Math.sin(t * 2 + node.userData.id) * 0.15;
      node.scale.set(s, s, s);
    } else if (node === hoveredNode) {
      node.scale.set(1.6, 1.6, 1.6);
      node.material.opacity = 0.75;
    } else {
      node.scale.set(1, 1, 1);
      node.material.opacity = 0.35;
    }
  });

  updateSurfaceRipples(t);

  // crystal float + rotation
  if (crystalGroup && crystalGroup.userData.spawnTime !== null) {
    crystalGroup.rotation.y += 0.01;
    crystalGroup.position.y =
      CONFIG.planet.radius * 0.6 + Math.sin(t * 0.8) * 0.25;
    if (hoveredCrystal) {
      const s = crystalGroup.scale.x;
      crystalGroup.scale.set(s * 1.002, s * 1.002, s * 1.002);
    }
  }

  // camera zoom (lerped for a cinematic feel) — suspended during zone transitions,
  // which drive the camera themselves
  if (!zoneTransition) {
    cameraRig.distance = THREE.MathUtils.lerp(
      cameraRig.distance,
      cameraRig.targetDistance,
      CONFIG.camera.zoomLerp
    );

    // mouse parallax on the camera position
    cameraRig.parallaxX = THREE.MathUtils.lerp(
      cameraRig.parallaxX,
      pointer.normX * CONFIG.parallax.strength,
      CONFIG.parallax.lerp
    );
    cameraRig.parallaxY = THREE.MathUtils.lerp(
      cameraRig.parallaxY,
      pointer.normY * CONFIG.parallax.strength,
      CONFIG.parallax.lerp
    );

    camera.position.x = cameraRig.parallaxX;
    camera.position.y = cameraRig.parallaxY;
    camera.position.z = cameraRig.distance;
    camera.lookAt(0, 0, 0);
  }

  // near particles: subtle repel from cursor world position + settle back
  updateNearParticles(t);

  // slow independent rotation for the distant starfield (depth cue)
  farParticles.rotation.y += 0.0002;
  farParticles.rotation.x += 0.00005;

  // V2 systems
  updateOrbitalObjects(t);
  updatePortal(t);
  updateShard(t);
  updateMicroZoom();
  updateSecretZone(delta);
  updateFragmentAbsorption(t);
  updateWowEvent(t);
  updateSignalPulses(t);
  updateChargeVisual(t);

  // V3 systems
  updateConstellationZone(t);
  updateZoneTransition(t);

  // V4 systems
  updateGravityZone(t, delta);

  updateHover();
}

/* ----------------------------------------------------------
   V2 — "signal" mechanic (section 11): a very subtle halo pulse
   when the cursor passes near a hidden object without hovering it
---------------------------------------------------------- */
function updateSignalPulses(t) {
  raycastPoint.set(pointer.normX, pointer.normY);
  raycaster.setFromCamera(raycastPoint, camera);
  const mouseWorld = raycaster.ray.origin
    .clone()
    .add(raycaster.ray.direction.clone().multiplyScalar(cameraRig.distance));

  const signalRadius = 2.2;
  Object.values(orbitalObjects).forEach((obj) => {
    if (obj.userData.collected) return;
    const worldPos = new THREE.Vector3();
    obj.getWorldPosition(worldPos);
    const dist = worldPos.distanceTo(mouseWorld);
    if (dist < signalRadius && obj !== hoveredOrbital) {
      const proximity = 1 - dist / signalRadius;
      obj.userData.halo.material.opacity = 0.3 + proximity * 0.25;
    } else if (obj !== hoveredOrbital) {
      obj.userData.halo.material.opacity = THREE.MathUtils.lerp(
        obj.userData.halo.material.opacity,
        0.3,
        0.05
      );
    }
  });
}

/* ----------------------------------------------------------
   V2 — cursor charge-ring visual (section 19)
---------------------------------------------------------- */
function updateChargeVisual(t) {
  const ring = document.getElementById('cursor-ring');
  if (interactionMode === 'charge' && charge.target) {
    const held = t - charge.startTime;
    const p = Math.min(held / CONFIG.charge.holdDuration, 1);
    ring.classList.add('charging');
    ring.style.setProperty('--charge', p.toFixed(3));
  } else {
    ring.classList.remove('charging');
    ring.style.removeProperty('--charge');
  }
}

function updateNearParticles(t) {
  const posAttr = nearParticles.geometry.attributes.position;
  const base = nearParticles.geometry.userData.base;
  const count = posAttr.count;

  // project mouse into world space roughly at the particle field depth
  raycastPoint.set(pointer.normX, pointer.normY);
  raycaster.setFromCamera(raycastPoint, camera);
  const mouseWorld = raycaster.ray.origin
    .clone()
    .add(raycaster.ray.direction.clone().multiplyScalar(cameraRig.distance));

  for (let i = 0; i < count; i++) {
    const ix = i * 3;
    const bx = base[ix], by = base[ix + 1], bz = base[ix + 2];

    // gentle ambient bob
    const wobble = Math.sin(t * 0.6 + i) * 0.05;

    let x = bx + wobble;
    let y = by + Math.cos(t * 0.5 + i) * 0.05;
    let z = bz;

    const dx = x - mouseWorld.x;
    const dy = y - mouseWorld.y;
    const dz = z - mouseWorld.z;
    const distSq = dx * dx + dy * dy + dz * dz;
    const influenceRadius = 3.2;

    if (distSq < influenceRadius * influenceRadius) {
      const dist = Math.sqrt(distSq) || 0.001;
      const push = (1 - dist / influenceRadius) * 0.6;
      x += (dx / dist) * push;
      y += (dy / dist) * push;
      z += (dz / dist) * push;
    }

    posAttr.array[ix] = x;
    posAttr.array[ix + 1] = y;
    posAttr.array[ix + 2] = z;
  }
  posAttr.needsUpdate = true;
}

/* ================================================================
   ANIMATE LOOP
============================================================ */
function animate() {
  requestAnimationFrame(animate);
  const t = clock.getElapsedTime();
  const delta = clock.getDelta();
  update(t, delta);
  renderer.render(scene, camera);
}

/* ================================================================
   BOOT
============================================================ */
function init() {
  clock = new THREE.Clock();
  initRenderer();
  initScene();
  initCamera();
  initLights();
  initWorldGroup();
  createPlanet();
  createRings();
  createNodes();
  createMicroStructures();
  createFarParticles();
  createNearParticles();
  createCrystal();
  // V2 — system objects, portal, shard, secret zone
  initOrbitalGroup();
  createSystemObjects();
  createGravityGate();
  createPortal();
  createShard();
  createSecretZone();
  // V3 — the constellation zone (built eagerly so saved progress can be
  // restored immediately, even though it stays hidden until entered)
  createConstellationZone();
  // V4 — the gravity zone (also built eagerly, same reasoning)
  createGravityZone();
  setupPointerEvents();
  applyLoadedState(loadGame());
  animate();
}

init();

</script>
