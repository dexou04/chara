<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>Personnage 3D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #95A8C8;
    touch-action: none; /* évite le scroll/zoom natif sur mobile pendant l'interaction */
  }
  #app {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  /* Écran de chargement */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    background: #95A8C8;
    z-index: 10;
    transition: opacity 0.6s ease;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #loading.hidden {
    opacity: 0;
    pointer-events: none;
  }
  .spinner {
    width: 42px;
    height: 42px;
    border: 3px solid rgba(255,255,255,0.35);
    border-top-color: #ffffff;
    border-radius: 50%;
    animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-text {
    color: #ffffff;
    font-size: 14px;
    letter-spacing: 0.03em;
    opacity: 0.9;
  }

  /* petite indication tactile discrète */
  #hint {
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    color: rgba(255,255,255,0.85);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    font-size: 12px;
    letter-spacing: 0.04em;
    text-shadow: 0 1px 3px rgba(0,0,0,0.25);
    pointer-events: none;
    transition: opacity 1s ease;
    z-index: 5;
  }
  #hint.hidden { opacity: 0; }
</style>
</head>
<body>
  <div id="app"></div>

  <div id="loading">
    <div class="spinner"></div>
    <div id="loading-text">Chargement du personnage… 0%</div>
  </div>

  <div id="hint">Glisser le fond pour tourner · glisser un membre pour le bouger</div>

  <!-- Import map : on charge three.js et ses modules additionnels (FBXLoader, OrbitControls) -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from "three";
    import { FBXLoader } from "three/addons/loaders/FBXLoader.js";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";

    // ---------------------------------------------------------------
    // Config
    // ---------------------------------------------------------------
    const BACKGROUND_COLOR = 0x95a8c8;
    const MODEL_URL = "./assets/character.fbx";

    // Palette "figurine" (au lieu des textures d'origine, abîmées) :
    // corps noir glacé, dégradé vers le bleu sur les extrémités
    // (bout des oreilles, mains, pieds), à l'image de la référence fournie.
    const COLOR_BODY = new THREE.Color(0x0c0c0c);
    const COLOR_TIP = new THREE.Color(0x3f5fd8);
    // portion (0-1) des vertex les plus "distaux" concernés par le dégradé
    const GRADIENT_START_PERCENTILE = 0.55;
    const GRADIENT_END_PERCENTILE = 0.92;

    const container = document.getElementById("app");
    const loadingEl = document.getElementById("loading");
    const loadingText = document.getElementById("loading-text");
    const hintEl = document.getElementById("hint");

    // ---------------------------------------------------------------
    // Scène / caméra / renderer
    // ---------------------------------------------------------------
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(BACKGROUND_COLOR);
    // léger brouillard pour fondre les particules lointaines dans le fond
    scene.fog = new THREE.Fog(BACKGROUND_COLOR, 6, 14);

    const camera = new THREE.PerspectiveCamera(
      35,
      container.clientWidth / container.clientHeight,
      0.1,
      100
    );
    camera.position.set(0, 1.4, 4.2);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.05;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Environnement de studio : donne des reflets doux et réalistes
    // au matériau glossy (indispensable pour l'effet "figurine plastique")
    const pmremGenerator = new THREE.PMREMGenerator(renderer);
    scene.environment = pmremGenerator.fromScene(new RoomEnvironment(), 0.04).texture;

    // ---------------------------------------------------------------
    // Lumières
    // ---------------------------------------------------------------
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x6b7aa1, 0.9);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(2.5, 4, 3);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.set(1024, 1024);
    keyLight.shadow.camera.near = 0.5;
    keyLight.shadow.camera.far = 12;
    keyLight.shadow.camera.left = -3;
    keyLight.shadow.camera.right = 3;
    keyLight.shadow.camera.top = 3;
    keyLight.shadow.camera.bottom = -3;
    keyLight.shadow.bias = -0.0005;
    scene.add(keyLight);

    const rimLight = new THREE.DirectionalLight(0xcfe0ff, 1.1);
    rimLight.position.set(-3, 2, -3);
    scene.add(rimLight);

    const fillLight = new THREE.DirectionalLight(0xffffff, 0.4);
    fillLight.position.set(-2, 1, 3);
    scene.add(fillLight);

    // ombre douce au sol (invisible, reçoit juste l'ombre portée)
    const shadowGround = new THREE.Mesh(
      new THREE.CircleGeometry(3, 48),
      new THREE.ShadowMaterial({ opacity: 0.18 })
    );
    shadowGround.rotation.x = -Math.PI / 2;
    shadowGround.position.y = 0;
    shadowGround.receiveShadow = true;
    scene.add(shadowGround);

    // ---------------------------------------------------------------
    // Membres articulés (le FBX n'a pas de squelette : on simule une
    // articulation en pivotant les vertex des extrémités — oreilles,
    // mains, pieds — autour d'un point d'attache estimé automatiquement)
    // ---------------------------------------------------------------
    const LIMB_NONE = 0, LIMB_EAR_L = 1, LIMB_EAR_R = 2,
      LIMB_ARM_L = 3, LIMB_ARM_R = 4, LIMB_LEG_L = 5, LIMB_LEG_R = 6;
    const DRAG_SENSITIVITY = 0.012; // radians par pixel glissé
    const MAX_LIMB_ANGLE = THREE.MathUtils.degToRad(55);
    const SPRING_SPEED = 9; // vitesse du retour élastique

    // ---------------------------------------------------------------
    // Contrôles (rotation à la souris / au doigt)
    // ---------------------------------------------------------------
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.1, 0);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 2.2;
    controls.maxDistance = 7;
    controls.minPolarAngle = Math.PI * 0.15;
    controls.maxPolarAngle = Math.PI * 0.85;
    controls.autoRotate = true;
    controls.autoRotateSpeed = 1.1;
    controls.update();

    // coupe l'auto-rotation pendant l'interaction, la reprend après un délai
    let autoRotateTimeout = null;
    function pauseAutoRotate() {
      controls.autoRotate = false;
      hintEl.classList.add("hidden");
      clearTimeout(autoRotateTimeout);
      autoRotateTimeout = setTimeout(() => {
        controls.autoRotate = true;
      }, 2500);
    }
    renderer.domElement.addEventListener("pointerdown", pauseAutoRotate);

    // ---------------------------------------------------------------
    // Particules brillantes
    // ---------------------------------------------------------------
    function createGlowTexture() {
      const size = 128;
      const canvas = document.createElement("canvas");
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext("2d");
      const gradient = ctx.createRadialGradient(
        size / 2, size / 2, 0,
        size / 2, size / 2, size / 2
      );
      gradient.addColorStop(0, "rgba(255,255,255,1)");
      gradient.addColorStop(0.35, "rgba(255,255,255,0.7)");
      gradient.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, size, size);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      return tex;
    }

    const PARTICLE_COUNT = 260;
    const particleGeometry = new THREE.BufferGeometry();
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const seeds = new Float32Array(PARTICLE_COUNT); // pour désynchroniser l'animation
    const radii = new Float32Array(PARTICLE_COUNT);
    const heights = new Float32Array(PARTICLE_COUNT);
    const angles = new Float32Array(PARTICLE_COUNT);
    const sizes = new Float32Array(PARTICLE_COUNT);

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const angle = Math.random() * Math.PI * 2;
      const radius = 0.9 + Math.random() * 1.9;
      const height = Math.random() * 3.0 - 0.2;
      angles[i] = angle;
      radii[i] = radius;
      heights[i] = height;
      seeds[i] = Math.random() * Math.PI * 2;
      sizes[i] = 0.02 + Math.random() * 0.05;

      positions[i * 3] = Math.cos(angle) * radius;
      positions[i * 3 + 1] = height;
      positions[i * 3 + 2] = Math.sin(angle) * radius;
    }

    particleGeometry.setAttribute("position", new THREE.BufferAttribute(positions, 3));

    const particleMaterial = new THREE.PointsMaterial({
      size: 0.06,
      map: createGlowTexture(),
      transparent: true,
      opacity: 0.9,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
      color: 0xffffff,
      sizeAttenuation: true,
    });

    const particles = new THREE.Points(particleGeometry, particleMaterial);
    scene.add(particles);

    // quelques particules plus grosses / plus lumineuses pour la profondeur
    const sparklePositions = positions; // on réutilise le même tableau de base

    // ---------------------------------------------------------------
    // Chargement du personnage
    // ---------------------------------------------------------------

    // Calcule la couleur par sommet (dégradé noir → bleu sur les extrémités)
    // ET construit un "rig" léger : classe chaque sommet éloigné du centre
    // dans un membre (oreille/main/pied gauche ou droite), avec un pivot et
    // deux axes de rotation par membre, pour permettre de le faire bouger.
    function setupCharacterMesh(mesh) {
      const geometry = mesh.geometry;
      const posAttr = geometry.attributes.position;
      const count = posAttr.count;

      const box = new THREE.Box3().setFromBufferAttribute(posAttr);
      const center = box.getCenter(new THREE.Vector3());

      const distances = new Float32Array(count);
      const dirs = new Float32Array(count * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < count; i++) {
        v.fromBufferAttribute(posAttr, i).sub(center);
        const d = v.length();
        distances[i] = d;
        if (d > 1e-6) v.divideScalar(d);
        dirs[i * 3] = v.x;
        dirs[i * 3 + 1] = v.y;
        dirs[i * 3 + 2] = v.z;
      }

      const sorted = Array.from(distances).sort((a, b) => a - b);
      const pct = (p) => sorted[Math.min(count - 1, Math.floor(p * (count - 1)))];
      const startDist = pct(GRADIENT_START_PERCENTILE);
      const endDist = pct(GRADIENT_END_PERCENTILE);

      const colors = new Float32Array(count * 3);
      const weight = new Float32Array(count); // 0 = statique, 1 = extrémité complète
      const limbId = new Uint8Array(count);
      const tmpColor = new THREE.Color();
      const limbDirSum = [null, new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3(), new THREE.Vector3()];
      const limbIndices = [null, [], [], [], [], [], []];

      for (let i = 0; i < count; i++) {
        const t = THREE.MathUtils.smoothstep(distances[i], startDist, endDist);
        weight[i] = t;

        tmpColor.copy(COLOR_BODY).lerp(COLOR_TIP, t);
        colors[i * 3] = tmpColor.r;
        colors[i * 3 + 1] = tmpColor.g;
        colors[i * 3 + 2] = tmpColor.b;

        if (t > 0.02) {
          const dx = dirs[i * 3], dy = dirs[i * 3 + 1], dz = dirs[i * 3 + 2];
          let limb;
          if (dy > 0.35) limb = dx < 0 ? LIMB_EAR_L : LIMB_EAR_R;
          else if (dy < -0.35) limb = dx < 0 ? LIMB_LEG_L : LIMB_LEG_R;
          else limb = dx < 0 ? LIMB_ARM_L : LIMB_ARM_R;
          limbId[i] = limb;
          limbIndices[limb].push(i);
          limbDirSum[limb].x += dx; limbDirSum[limb].y += dy; limbDirSum[limb].z += dz;
        }
      }
      geometry.setAttribute("color", new THREE.BufferAttribute(colors, 3));

      // pivot + axes de rotation pour chaque membre détecté
      const pivots = [null], yawAxes = [null], pitchAxes = [null];
      for (let limb = 1; limb <= 6; limb++) {
        const dirSum = limbDirSum[limb];
        const avgDir = dirSum.lengthSq() > 1e-8 ? dirSum.normalize() : new THREE.Vector3(0, 1, 0);
        pivots[limb] = center.clone().addScaledVector(avgDir, startDist);
        yawAxes[limb] = new THREE.Vector3(0, 1, 0);
        let pitchAxis = new THREE.Vector3().crossVectors(yawAxes[limb], avgDir);
        if (pitchAxis.lengthSq() < 0.02) pitchAxis = new THREE.Vector3().crossVectors(new THREE.Vector3(1, 0, 0), avgDir);
        pitchAxes[limb] = pitchAxis.normalize();
      }

      mesh.userData.rig = {
        basePositions: Float32Array.from(posAttr.array),
        weight,
        limbId,
        limbIndices,
        pivots,
        yawAxes,
        pitchAxes,
        current: new Float32Array(7), // angle de lacet actuel par membre
        currentPitch: new Float32Array(7),
        target: new Float32Array(7),
        targetPitch: new Float32Array(7),
        active: 0,
      };
    }

    // Applique la pose courante du rig aux positions des sommets concernés
    const _tmpV = new THREE.Vector3();
    const _tmpQYaw = new THREE.Quaternion();
    const _tmpQPitch = new THREE.Quaternion();
    const _tmpQ = new THREE.Quaternion();
    function updateLimbGeometry(mesh) {
      const rig = mesh.userData.rig;
      if (!rig) return false;
      const posAttr = mesh.geometry.attributes.position;
      let anyActive = false;

      for (let limb = 1; limb <= 6; limb++) {
        const yaw = rig.current[limb];
        const pitch = rig.currentPitch[limb];
        if (Math.abs(yaw) < 0.0005 && Math.abs(pitch) < 0.0005) continue;
        anyActive = true;
        const indices = rig.limbIndices[limb];
        const pivot = rig.pivots[limb];

        for (let k = 0; k < indices.length; k++) {
          const i = indices[k];
          const w = rig.weight[i];
          _tmpQYaw.setFromAxisAngle(rig.yawAxes[limb], yaw * w);
          _tmpQPitch.setFromAxisAngle(rig.pitchAxes[limb], pitch * w);
          _tmpQ.copy(_tmpQYaw).multiply(_tmpQPitch);

          _tmpV.set(
            rig.basePositions[i * 3] - pivot.x,
            rig.basePositions[i * 3 + 1] - pivot.y,
            rig.basePositions[i * 3 + 2] - pivot.z
          ).applyQuaternion(_tmpQ).add(pivot);

          posAttr.setXYZ(i, _tmpV.x, _tmpV.y, _tmpV.z);
        }
      }

      if (anyActive) {
        posAttr.needsUpdate = true;
        mesh.geometry.computeVertexNormals();
      }
      return anyActive;
    }

    // Raycasting : détermine quel membre (le cas échéant) est sous le pointeur
    const raycaster = new THREE.Raycaster();
    const pointerNDC = new THREE.Vector2();
    function pickLimb(event) {
      if (!character) return null;
      const rect = renderer.domElement.getBoundingClientRect();
      pointerNDC.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      pointerNDC.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(pointerNDC, camera);
      const hits = raycaster.intersectObject(character, true);
      if (hits.length === 0 || !hits[0].face) return null;
      const mesh = hits[0].object;
      const rig = mesh.userData.rig;
      if (!rig) return null;
      const limb = rig.limbId[hits[0].face.a];
      return limb ? { mesh, rig, limb } : null;
    }

    let draggingRig = null;
    let dragLimb = 0;
    let dragStartX = 0, dragStartY = 0;
    let dragStartYaw = 0, dragStartPitch = 0;

    renderer.domElement.addEventListener("pointerdown", (event) => {
      const pick = pickLimb(event);
      if (pick) {
        draggingRig = pick.rig;
        dragLimb = pick.limb;
        draggingRig.active = dragLimb;
        dragStartX = event.clientX;
        dragStartY = event.clientY;
        dragStartYaw = draggingRig.current[dragLimb];
        dragStartPitch = draggingRig.currentPitch[dragLimb];
        controls.enabled = false;
        renderer.domElement.setPointerCapture(event.pointerId);
        renderer.domElement.style.cursor = "grabbing";
      }
    });

    renderer.domElement.addEventListener("pointermove", (event) => {
      if (draggingRig) {
        const dx = event.clientX - dragStartX;
        const dy = event.clientY - dragStartY;
        const yaw = THREE.MathUtils.clamp(dragStartYaw + dx * DRAG_SENSITIVITY, -MAX_LIMB_ANGLE, MAX_LIMB_ANGLE);
        const pitch = THREE.MathUtils.clamp(dragStartPitch - dy * DRAG_SENSITIVITY, -MAX_LIMB_ANGLE, MAX_LIMB_ANGLE);
        draggingRig.current[dragLimb] = yaw;
        draggingRig.currentPitch[dragLimb] = pitch;
        draggingRig.target[dragLimb] = yaw;
        draggingRig.targetPitch[dragLimb] = pitch;
      } else if (character) {
        // survol : curseur "grab" au-dessus d'un membre déplaçable
        const pick = pickLimb(event);
        renderer.domElement.style.cursor = pick ? "grab" : "default";
      }
    });

    function releaseLimb() {
      if (draggingRig) {
        draggingRig.target[dragLimb] = 0;
        draggingRig.targetPitch[dragLimb] = 0;
        draggingRig.active = 0;
        draggingRig = null;
        dragLimb = 0;
        controls.enabled = true;
        renderer.domElement.style.cursor = "default";
      }
    }
    renderer.domElement.addEventListener("pointerup", releaseLimb);
    renderer.domElement.addEventListener("pointercancel", releaseLimb);
    renderer.domElement.addEventListener("pointerleave", releaseLimb);

    let character = null;
    let floatBase = 0;

    const fbxLoader = new FBXLoader();
    fbxLoader.load(
      MODEL_URL,
      (object) => {
        character = object;

        // Remplace le matériau d'origine (texture patchwork) par un rendu
        // "figurine" mate : noir + dégradé bleu par vertex colors, et
        // prépare le rig de membres articulés (drag pour bouger).
        character.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
            setupCharacterMesh(child);
            child.material = new THREE.MeshStandardMaterial({
              vertexColors: true,
              metalness: 0.0,
              roughness: 0.75,
              envMapIntensity: 0.5,
            });
          }
        });

        // Centre et met à l'échelle le modèle pour qu'il tienne dans le cadre,
        // quelle que soit l'échelle d'origine du FBX
        const box = new THREE.Box3().setFromObject(character);
        const size = new THREE.Vector3();
        const center = new THREE.Vector3();
        box.getSize(size);
        box.getCenter(center);

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetHeight = 2.1;
        const scale = targetHeight / maxDim;
        character.scale.setScalar(scale);

        // recalcule la bounding box après mise à l'échelle pour un centrage précis
        const box2 = new THREE.Box3().setFromObject(character);
        const size2 = new THREE.Vector3();
        const center2 = new THREE.Vector3();
        box2.getSize(size2);
        box2.getCenter(center2);

        character.position.x -= center2.x;
        character.position.z -= center2.z;
        character.position.y -= box2.min.y; // pose les pieds au sol (y = 0)

        floatBase = character.position.y;

        // recentre la cible des contrôles sur le milieu du personnage
        controls.target.set(0, size2.y * 0.55, 0);
        controls.update();

        scene.add(character);

        loadingEl.classList.add("hidden");
      },
      (xhr) => {
        if (xhr.total) {
          const pct = Math.min(100, Math.round((xhr.loaded / xhr.total) * 100));
          loadingText.textContent = `Chargement du personnage… ${pct}%`;
        }
      },
      (error) => {
        console.error("Erreur de chargement du FBX :", error);
        loadingText.textContent = "Erreur de chargement du modèle.";
      }
    );

    // ---------------------------------------------------------------
    // Boucle d'animation
    // ---------------------------------------------------------------
    const clock = new THREE.Clock();
    let elapsedTime = 0;

    function animate() {
      requestAnimationFrame(animate);
      const deltaTime = Math.min(0.05, clock.getDelta());
      elapsedTime += deltaTime;
      const t = elapsedTime;

      // flottement du personnage
      if (character) {
        character.position.y = floatBase + Math.sin(t * 1.2) * 0.06;
        character.rotation.z = Math.sin(t * 0.8) * 0.015;

        // retour élastique des membres relâchés + application de la pose
        character.traverse((child) => {
          if (child.isMesh && child.userData.rig) {
            const rig = child.userData.rig;
            for (let limb = 1; limb <= 6; limb++) {
              if (limb === rig.active) continue; // pendant le drag, la valeur est déjà à jour
              const k = 1 - Math.exp(-SPRING_SPEED * deltaTime);
              rig.current[limb] += (rig.target[limb] - rig.current[limb]) * k;
              rig.currentPitch[limb] += (rig.targetPitch[limb] - rig.currentPitch[limb]) * k;
            }
            updateLimbGeometry(child);
          }
        });
      }

      // dérive douce des particules (flottement + rotation lente autour du perso)
      const posAttr = particleGeometry.attributes.position;
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const angle = angles[i] + t * 0.06 * (i % 2 === 0 ? 1 : -1);
        const bob = Math.sin(t * 0.6 + seeds[i]) * 0.15;
        posAttr.array[i * 3] = Math.cos(angle) * radii[i];
        posAttr.array[i * 3 + 1] = heights[i] + bob;
        posAttr.array[i * 3 + 2] = Math.sin(angle) * radii[i];
      }
      posAttr.needsUpdate = true;

      // scintillement léger de l'opacité globale
      particleMaterial.opacity = 0.75 + Math.sin(t * 2.0) * 0.15;

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ---------------------------------------------------------------
    // Responsive
    // ---------------------------------------------------------------
    function onResize() {
      const w = container.clientWidth;
      const h = container.clientHeight;
      camera.aspect = w / h;

      // Sur mobile (portrait), on recule un peu la caméra pour garder
      // le personnage entier dans le cadre
      const isPortrait = h > w;
      camera.position.setLength(isPortrait ? 5.4 : 4.2);

      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }
    window.addEventListener("resize", onResize);
    window.addEventListener("orientationchange", () => setTimeout(onResize, 200));
    onResize();
  </script>
</body>
</html>
